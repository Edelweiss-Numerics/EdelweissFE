<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img" aria-label="The topology update gives a Change. Change.NONE: nothing happens, both the DofNumbering and the DofLocations stay, and no hook is called. Change.LOCATIONS: withNewLocations gives the same DofNumbering and a new DofLocations, and only onNewLocations is called. Change.NUMBERING or Change.MESH: buildDiscreteSystem gives a new DofNumbering and a new DofLocations, and onNewNumbering, then onNewLocations, are called.">
<title>The topology update gives a Change. Change.NONE: nothing happens, both the DofNumbering and the DofLocations stay, and no hook is called. Change.LOCATIONS: withNewLocations gives the same DofNumbering and a new DofLocations, and only onNewLocations is called. Change.NUMBERING or Change.MESH: buildDiscreteSystem gives a new DofNumbering and a new DofLocations, and onNewNumbering, then onNewLocations, are called.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/></marker><marker id="arrowStart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#6e7781"/></marker></defs>
<rect x="0" y="0" width="980" height="560" fill="#ffffff"/>
<rect x="10" y="10" width="960" height="58" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="24" y="32" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">Start of every increment and of every retry (NED: when due): the topology update</text>
<text x="24" y="52" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">model modifiers may change the mesh (Change.MESH); model.updateConnectivity() brings the connectivity up to date and reports the rest.</text>
