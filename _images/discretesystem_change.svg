<text x="24" y="520" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">blue: built anew     grey, dashed: kept     the larger Change wins:  NONE &lt; LOCATIONS &lt; NUMBERING &lt; MESH</text>
