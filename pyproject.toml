[build-system]
requires = ["setuptools", "Cython", "numpy"]


[project]
name = "EdelweissFE"
version = "26.05"
description = "EdelweissFE: A light-weight, platform-independent, parallel finite element framework."
readme = "README.md"
authors = [
    { name = "Matthias Neuner", email = "matthias.neuner@uibk.ac.at" }
]
license = { text = "LGPL-2.1" }
urls = { Homepage = "https://github.com/EdelweissFE/EdelweissFE" }
requires-python = ">=3.14"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[project.scripts]
edelweissfe = "edelweissfe._cli._edelweissfe:main"
run_tests_edelweissfe = "edelweissfe._cli._run_tests_edelweissfe:main"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.pytest.ini_options]
# This is a new, separate pytest suite (see tests/), distinct from the bespoke
# `run_tests_edelweissfe` .inp-driven CLI runner (testfiles/) and the unrelated legacy `test/`
# data directory. Pin testpaths explicitly so a plain `python -m pytest` from the repo root does
# not also try to collect the many stray ad-hoc `test_*.py` scripts scattered at the repo root.
testpaths = ["tests"]
markers = [
    # Tests that spawn one fresh interpreter per module to check an import-order property, which
    # cannot be done in-process. Deselect with `-m "not slow"` while iterating.
    "slow: spawns many subprocesses; seconds rather than milliseconds",
]
