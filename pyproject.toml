[build-system]
# Cython >= 3.1 is required for free-threading (cp314t) support and the
# freethreading_compatible directive used in setup.py.
requires = ["setuptools>=77", "Cython>=3.1", "numpy>=2"]


[project]
name = "EdelweissFE"
version = "26.11"
description = "EdelweissFE: A light-weight, platform-independent, parallel finite element framework."
readme = "README.md"
authors = [
    { name = "Matthias Neuner", email = "matthias.neuner@uibk.ac.at" }
]
license = "LGPL-2.1"
license-files = ["LICENSE.md"]
urls = { Homepage = "https://github.com/EdelweissFE/EdelweissFE" }
requires-python = ">=3.14"
dependencies = [
    "numpy>=2",
    "scipy",
    "sympy",
    "h5py",
    "matplotlib",
    "prettytable",
    "rich",
]

[project.optional-dependencies]
# Optional features; the corresponding modules raise an ImportError at usage time
# if the extra is not installed.
randomfields = ["gstools"]        # analyticalfields/randomscalar, sections/planerandomthickness
microstructure = ["meshio"]       # generators/microstructuregenerator
viz = ["pyvista"]                 # analyticalfields/fromvtk
gmres = ["pyamg"]                 # linsolve/gmres
advancedmaterials = ["num_dual"]  # materials/hyperelasticadvanced, hyperplasticadvanced
full = ["gstools", "meshio", "pyvista", "pyamg", "num_dual"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[project.scripts]
edelweissfe = "edelweissfe._cli._edelweissfe:main"
run_tests_edelweissfe = "edelweissfe._cli._run_tests_edelweissfe:main"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.pytest.ini_options]
# This is a new, separate pytest suite (see tests/), distinct from the bespoke
# `run_tests_edelweissfe` .inp-driven CLI runner (testfiles/) and the unrelated legacy `test/`
# data directory. Pin testpaths explicitly so a plain `python -m pytest` from the repo root does
# not also try to collect the many stray ad-hoc `test_*.py` scripts scattered at the repo root.
testpaths = ["tests"]
markers = [
    # Tests that spawn one fresh interpreter per module to check an import-order property, which
    # cannot be done in-process. Deselect with `-m "not slow"` while iterating.
    "slow: spawns many subprocesses; seconds rather than milliseconds",
]
