name: format

on:
  # Pushes to the long-lived branches only: a branch with an open pull request is tested by the
  # pull_request event, and testing every push as well would run each workflow twice.
  push:
    branches: [master, next_v26.11]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
