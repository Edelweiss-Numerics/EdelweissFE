name: Documentation

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      # Installs exactly what conda-lock.yml pins (conda packages, no solving).
      - uses: ./.github/actions/setup-locked-env

      # Branch selection, caching and MARMOT_INSTALL_DIR: see .github/actions/build-marmot.
      - uses: ./.github/actions/build-marmot

      - name: Build EdelweissFE
        shell: bash -leo pipefail {0}
        run: |
          pip install -v --no-deps --no-build-isolation .

      - name: Building EdelweissFE documentation
        shell: bash -leo pipefail {0}
        run: |
          sphinx-build ./doc/source/ ./docs -b html

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: ./docs

      - name: Deploy
        if: github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN}}
          publish_dir: ./docs
          publish_branch: gh-pages

