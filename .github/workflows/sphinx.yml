name: Documentation

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      # Installs exactly what conda-lock.yml pins (conda packages, no solving).
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: conda-lock.yml
          environment-name: edelweissfe
          cache-environment: true
          init-shell: bash

      - name: Install Marmot
        shell: bash -leo pipefail {0}
        run: |
          # Use github.base_ref (target of PR).
          # If not a PR (like a push to master), fall back to github.ref_name.
          TARGET_BRANCH="${{ github.base_ref || github.ref_name }}"

          echo "Pull Request Target/Current Branch is: $TARGET_BRANCH"

          # Clone into the parent directory, never into the checkout: Marmot ships a committed symlink
          # _codeql_detected_source_root -> ., which `pip install .` otherwise follows into itself while
          # collecting the wheel's files (see run_tests_with_marmot_macos.yml).
          cd ..
          git clone --recurse-submodules https://github.com/MAteRialMOdelingToolbox/Marmot/
          cd Marmot

          # Attempt to switch to the branch matching the target branch
          if git show-ref --verify --quiet refs/remotes/origin/$TARGET_BRANCH; then
            echo "Matching branch found. Checking out $TARGET_BRANCH..."
            git checkout $TARGET_BRANCH
          else
            echo "Branch $TARGET_BRANCH not found in Marmot, staying on default branch."
          fi

          mkdir build
          cd build
          cmake -DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX -DCMAKE_PREFIX_PATH=$CONDA_PREFIX ..
          make install
          cd ../../

      - name: Build EdelweissFE
        shell: bash -leo pipefail {0}
        run: |
          pip install -v --no-deps --no-build-isolation .

      - name: Building EdelweissFE documentation
        shell: bash -leo pipefail {0}
        run: |
          sphinx-build ./doc/source/ ./docs -b html

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: ./docs

      - name: Deploy
        if: github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN}}
          publish_dir: ./docs
          publish_branch: gh-pages

