name: Run tests without Marmot

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: edelweissfe
          conda-remove-defaults: true
          # The environment does not solve under strict channel priority; see README.md.
          channel-priority: flexible

      - name: Install MKL (enables the PARDISO linear solver)
        shell: bash -leo pipefail {0}
        run: |
          conda install -y mkl mkl-include

      - name: Build EdelweissFE
        shell: bash -leo pipefail {0}
        run: |
          pip install --no-deps --no-build-isolation .

      - name: Run tests without Marmot
        shell: bash -leo pipefail {0}
        run: |
          # See run_tests_with_marmot.yml: invoke the installed console script directly, not via
          # `python -m ...`, to avoid the repo root's uncompiled edelweissfe/ source tree
          # shadowing the properly built package installed into site-packages.
          coverage run "$(command -v run_tests_edelweissfe)" ./testfiles/edelweiss-only/
          coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: no-marmot
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

