name: Run tests without Marmot

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      # Installs exactly what conda-lock.yml pins (conda packages, no solving).
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: conda-lock.yml
          environment-name: edelweissfe
          cache-environment: true
          init-shell: bash

      - name: Build EdelweissFE
        shell: bash -leo pipefail {0}
        run: |
          pip install --no-deps --no-build-isolation .

      - name: Run tests without Marmot
        shell: bash -leo pipefail {0}
        run: |
          # See run_tests_with_marmot.yml: invoke the installed console script directly, not via
          # `python -m ...`, to avoid the repo root's uncompiled edelweissfe/ source tree
          # shadowing the properly built package installed into site-packages.
          coverage run "$(command -v run_tests_edelweissfe)" ./testfiles/edelweiss-only/
          coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: no-marmot
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

