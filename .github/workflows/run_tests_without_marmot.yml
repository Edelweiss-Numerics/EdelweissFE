name: Run tests without Marmot

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Setup Mambaforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          use-mamba: true
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: anaconda-client-env

      - name: Install conda packages
        shell: bash -l {0}
        run: |
          mamba install --file conda_requirements.txt

      - name: Install pip packages
        shell: bash -l {0}
        run: |
          pip install -r pip_requirements.txt

      - name: Build EdelweissFE
        shell: bash -l {0}
        run: |
          pip install .

      - name: Run tests without Marmot
        shell: bash -l {0}
        run: |
          # See run_tests_with_marmot.yml: invoke the installed console script directly, not via
          # `python -m ...`, to avoid the repo root's uncompiled edelweissfe/ source tree
          # shadowing the properly built package installed into site-packages.
          coverage run "$(command -v run_tests_edelweissfe)" ./testfiles/edelweiss-only/
          coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: no-marmot
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

