name: Run tests without Marmot

on:
  # Pushes to the long-lived branches only: a branch with an open pull request is tested by the
  # pull_request event, and testing every push as well would run each workflow twice.
  push:
    branches: [master, next_v26.11]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Fixed thread count, so that a result does not depend on the runner's core count.
env:
  OMP_NUM_THREADS: 2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Installs exactly what conda-lock.yml pins (conda packages, no solving).
      - uses: ./.github/actions/setup-locked-env

      - name: Build EdelweissFE
        shell: bash -leo pipefail {0}
        run: |
          pip install --no-deps --no-build-isolation .

      - name: Run tests without Marmot
        shell: bash -leo pipefail {0}
        run: |
          # See run_tests_with_marmot.yml: invoke the installed console script directly, not via
          # `python -m ...`, to avoid the repo root's uncompiled edelweissfe/ source tree
          # shadowing the properly built package installed into site-packages.
          coverage run "$(command -v run_tests_edelweissfe)" ./testfiles/edelweiss-only/
          coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: no-marmot
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

