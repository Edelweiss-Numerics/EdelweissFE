name: Lockfile

# conda-lock.yml pins the environment declared by environment.yml; conda/edelweissfe-dev/VERSION versions it (the
# edelweissfe-dev meta-package users install, see dev_environment.yml).
# - On every push/pull request: fail if conda-lock.yml is out of date with environment.yml (someone changed
#   environment.yml without re-locking), if a pull request changes conda-lock.yml without a new VERSION, or if the
#   documented conda create commands (README, installation docs, CONTRIBUTING, AGENTS) do not show the current VERSION.
# - Weekly: re-lock against the newest packages and open a pull request, whose CI then tests the
#   updated stack before it is merged, so upstream changes surface there instead of in someone's
#   unrelated pull request.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: VERSION is current and documented
        run: |
          version=$(cat conda/edelweissfe-dev/VERSION)
          for file in README.md doc/source/installation.rst CONTRIBUTING.md AGENTS.md; do
            if ! grep -q "edelweissfe-dev=$version" "$file"; then
              echo "::error file=$file::$file must show the install command with edelweissfe-dev=$version (conda/edelweissfe-dev/VERSION)."
              exit 1
            fi
          done
          if [ "${{ github.event_name }}" = pull_request ]; then
            base=origin/${{ github.base_ref }}
            if ! git diff --quiet "$base"...HEAD -- conda-lock.yml && git diff --quiet "$base"...HEAD -- conda/edelweissfe-dev/VERSION; then
              echo "::error::conda-lock.yml changed, so the environment changed: set a new date in conda/edelweissfe-dev/VERSION (and in the documented conda create commands)."
              exit 1
            fi
          fi

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: conda-lock
          create-args: conda-lock
          init-shell: bash

      - name: conda-lock.yml matches environment.yml
        shell: bash -leo pipefail {0}
        run: |
          # --check-input-hash re-locks only if the inputs changed since conda-lock.yml was written.
          conda-lock lock --micromamba --check-input-hash -f environment.yml --virtual-package-spec virtual-packages.yml
          if ! git diff --quiet conda-lock.yml; then
            echo "::error::conda-lock.yml is out of date with environment.yml. Re-lock (see doc/source/installation.rst) and commit it."
            exit 1
          fi

  update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: next_v26.11

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: conda-lock
          create-args: conda-lock
          init-shell: bash

      - name: Re-lock
        shell: bash -leo pipefail {0}
        run: |
          cp conda-lock.yml conda-lock.old.yml
          conda-lock lock --micromamba -f environment.yml --virtual-package-spec virtual-packages.yml
          {
            echo "Weekly re-lock of \`conda-lock.yml\` against the newest packages. Changed packages:"
            echo
            echo '```'
            python - <<'PY'
          import yaml
          def pkgs(path):
              return {(p["platform"], p["name"]): p["version"] for p in yaml.safe_load(open(path))["package"]}
          old, new = pkgs("conda-lock.old.yml"), pkgs("conda-lock.yml")
          for key in sorted(old.keys() | new.keys()):
              if old.get(key) != new.get(key):
                  print(f"{key[0]:10} {key[1]:32} {old.get(key, '-'):>16} -> {new.get(key, '-')}")
          PY
            echo '```'
          } > body.md
          rm conda-lock.old.yml
          # A changed environment gets a new edelweissfe-dev version: today's date, also in the documented commands.
          if ! git diff --quiet conda-lock.yml; then
            old=$(cat conda/edelweissfe-dev/VERSION)
            new=$(date -u +%Y.%m.%d)
            echo "$new" > conda/edelweissfe-dev/VERSION
            sed -i "s/edelweissfe-dev=$old/edelweissfe-dev=$new/g" README.md doc/source/installation.rst CONTRIBUTING.md AGENTS.md
          fi

      - uses: peter-evans/create-pull-request@v7
        with:
          # Pull requests opened with the default GITHUB_TOKEN do not trigger other workflows, so
          # their CI would never run. LOCKFILE_UPDATE_TOKEN (a fine-grained token with contents and
          # pull-requests write access) makes CI run; without it the PR is still opened.
          token: ${{ secrets.LOCKFILE_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          base: next_v26.11
          branch: chore/update-conda-lock
          commit-message: "chore: update the locked environment"
          title: "chore: update the locked environment (conda-lock.yml, edelweissfe-dev)"
          body-path: body.md
          add-paths: |
            conda-lock.yml
            conda/edelweissfe-dev/VERSION
            README.md
            doc/source/installation.rst
            CONTRIBUTING.md
            AGENTS.md
          delete-branch: true
