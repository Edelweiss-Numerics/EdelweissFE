name: Update lockfile

# Weekly: re-solve pixi.lock against the latest conda-forge/channel packages and open a pull request
# if anything changed. That pull request's CI then tests the updated stack before it is merged, so
# upstream changes (a new Python build, a pyvista or Eigen major release, ...) surface there instead of
# in someone's unrelated pull request.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: next_v26.11

      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          run-install: false

      - name: Update pixi.lock
        run: |
          set -o pipefail
          pixi update --json | pixi exec pixi-diff-to-markdown > diff.md

      - uses: peter-evans/create-pull-request@v7
        with:
          # Pull requests opened with the default GITHUB_TOKEN do not trigger other workflows, so
          # their CI would never run. LOCKFILE_UPDATE_TOKEN (a fine-grained token with contents and
          # pull-requests write access) makes CI run; without it the PR is still opened.
          token: ${{ secrets.LOCKFILE_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          base: next_v26.11
          branch: chore/update-pixi-lock
          commit-message: "chore: update pixi.lock"
          title: "chore: update pixi.lock"
          body-path: diff.md
          add-paths: pixi.lock
          delete-branch: true
