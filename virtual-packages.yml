# System properties conda-lock assumes per platform when solving (it cannot inspect the target machine).
# macOS >= 14.0: conda-forge's qt6-main, a vtk dependency, needs moltenvk, which requires it.
# Windows 10 (build 20348, as Windows Server 2022): the Visual C++/UCRT runtime packages require Windows 10.
subdirs:
  linux-64:
    packages:
      __glibc: "2.28"
      __unix: "0"
  osx-arm64:
    packages:
      __osx: "14.0"
      __unix: "0"
  osx-64:
    packages:
      __osx: "14.0"
      __unix: "0"
  win-64:
    packages:
      __win: "10.0.20348"
