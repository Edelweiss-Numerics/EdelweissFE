<path d="M869,152 V138 H222" fill="none" stroke="#6e7781" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="540" y="133" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="middle" font-style="italic">next Newton iteration</text>
<rect x="250" y="286" width="420" height="24" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
<text x="260" y="302" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">loads (step actions) add − load, + tangent, to the entity they act on</text>
<rect x="236" y="320" width="734" height="196" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="250" y="342" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1f2328" text-anchor="start">2. Explicit: NED — no system matrix, no linear solver: a division per increment</text>
<rect x="250" y="388" width="158" height="88" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
<text x="260" y="407" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1f2328" text-anchor="start">net force</text>
<text x="260" y="424" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">f_net = f_ext − f_int</text>
<text x="260" y="439" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">elements, loads,</text>
<text x="260" y="454" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">constraints: P only</text>
<rect x="430" y="388" width="158" height="88" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
<text x="440" y="407" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1f2328" text-anchor="start">condense, constrain</text>
<text x="440" y="424" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">MPC: slave forces</text>
<text x="440" y="439" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">folded to masters</text>
<text x="440" y="454" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">Dirichlet: prescribed v</text>
<rect x="610" y="388" width="158" height="88" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.8"/>
<text x="620" y="407" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1f2328" text-anchor="start">lumped M, C</text>
<text x="620" y="424" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">a = (f_net − C v)</text>
<text x="620" y="439" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">  ÷ (M + ½Δt C)</text>
<text x="620" y="454" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">per DOF, no matrix</text>
<rect x="790" y="388" width="158" height="88" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
<text x="800" y="407" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1f2328" text-anchor="start">central difference</text>
<text x="800" y="424" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">v += Δt a, u += Δt v</text>
<text x="800" y="439" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">slaves follow masters</text>
<text x="800" y="454" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">stable Δt: Courant</text>
