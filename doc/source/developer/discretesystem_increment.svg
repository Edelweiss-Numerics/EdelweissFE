<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 534" width="1120" height="534" role="img" aria-label="One increment. 1: prepareIncrement checks whether the ID or the LM array changed, and the solver rebuilds what depends on them. Left: the discrete system with its elements and constraints; each computes its internal force P_e and tangent K_e, and its location places them in the global system. Implicit lane (NIST, NID and their variants), Newton&#x27;s method: residual and tangent, K_e into K[el], R = f_ext - sum of P_e, the MPC condensation of R; then the convergence check: in the first iteration the Dirichlet rows of R receive the prescribed increments, later they are zero and R and ddU are checked; if converged, the increment is accepted; otherwise solve and update: the MPC condensation of K in CSR format, identity rows for the Dirichlet DOFs, linSolver(K_, R) gives ddU, the slaves follow the masters, dU += ddU, and the next Newton iteration computes the entities again. Explicit lane (NED, NEDParallel): the net force R = f_ext - sum of P_e, without tangents, the MPC slave forces folded into the masters, zero in the Dirichlet rows; the velocity V += dt M^-1 R per DOF with the lumped mass, no matrix and no linear solve, the prescribed velocity on Dirichlet DOFs; the position dU = dt V, the slaves follow the masters; then the increment is accepted. 3: acceptIncrement writes U, dU, P, V and A to the node fields (a quasi-static solver writes V = A = 0), and model.advanceToTime lets the entities accept their state; then the step writes the output, and the next increment begins.">
<title>One increment. 1: prepareIncrement checks whether the ID or the LM array changed, and the solver rebuilds what depends on them. Left: the discrete system with its elements and constraints; each computes its internal force P_e and tangent K_e, and its location places them in the global system. Implicit lane (NIST, NID and their variants), Newton&#x27;s method: residual and tangent, K_e into K[el], R = f_ext - sum of P_e, the MPC condensation of R; then the convergence check: in the first iteration the Dirichlet rows of R receive the prescribed increments, later they are zero and R and ddU are checked; if converged, the increment is accepted; otherwise solve and update: the MPC condensation of K in CSR format, identity rows for the Dirichlet DOFs, linSolver(K_, R) gives ddU, the slaves follow the masters, dU += ddU, and the next Newton iteration computes the entities again. Explicit lane (NED, NEDParallel): the net force R = f_ext - sum of P_e, without tangents, the MPC slave forces folded into the masters, zero in the Dirichlet rows; the velocity V += dt M^-1 R per DOF with the lumped mass, no matrix and no linear solve, the prescribed velocity on Dirichlet DOFs; the position dU = dt V, the slaves follow the masters; then the increment is accepted. 3: acceptIncrement writes U, dU, P, V and A to the node fields (a quasi-static solver writes V = A = 0), and model.advanceToTime lets the entities accept their state; then the step writes the output, and the next increment begins.</title>
<defs><marker id="arrow0969da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="arrow6e7781" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/></marker></defs>
<rect x="0" y="0" width="1120" height="534" fill="#ffffff"/>
<rect x="16" y="12" width="1088" height="56" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="30" y="36" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">1.  prepareIncrement():  did the ID or the LM array change?</text>
<text x="30" y="56" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">If so, the solver rebuilds what depends on them before the increment is solved (section &quot;When the ID and the LM array change&quot;).</text>
<rect x="256" y="88" width="628" height="212" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="270" y="112" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">2.  Implicit: NIST, NID and their variants: Newton&#x27;s method</text>
<rect x="270.0" y="140" width="182.66666666666666" height="121" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
<text x="282.0" y="162" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">residual, tangent</text>
<text x="282.0" y="181" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">K_e into K[el]</text>
<text x="282.0" y="198" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">R = f_ext − ΣP_e</text>
<text x="282.0" y="215" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">MPC: R ← TᵀR</text>
<rect x="478.66666666666663" y="140" width="182.66666666666666" height="121" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
<text x="490.66666666666663" y="162" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">converged?</text>
<text x="490.66666666666663" y="181" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Dirichlet rows of R:</text>
<text x="490.66666666666663" y="198" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">1st iteration: prescribed</text>
<text x="490.66666666666663" y="215" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">increment; later 0.</text>
<text x="490.66666666666663" y="232" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Later iterations:</text>
<text x="490.66666666666663" y="249" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">R and ddU small?</text>
<rect x="687.3333333333333" y="140" width="182.66666666666666" height="121" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<text x="699.3333333333333" y="162" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">solve, update</text>
<text x="699.3333333333333" y="181" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">K_ = TᵀKT (MPC), CSR</text>
<text x="699.3333333333333" y="198" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Dirichlet: identity rows</text>
<text x="699.3333333333333" y="215" xml:space="preserve" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">linSolver(K_, R) → ddU</text>
<text x="699.3333333333333" y="232" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">slaves from masters</text>
<text x="699.3333333333333" y="249" xml:space="preserve" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">dU += ddU</text>
<path d="M452.66666666666663,200.5 H476.66666666666663" fill="none" stroke="#6e7781" stroke-width="1.4" marker-end="url(#arrow6e7781)"/>
<path d="M661.3333333333333,200.5 H685.3333333333333" fill="none" stroke="#6e7781" stroke-width="1.4" marker-end="url(#arrow6e7781)"/>
<text x="674.3333333333333" y="192.5" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle">no</text>
<path d="M778.6666666666666,261 V286 H224" fill="none" stroke="#6e7781" stroke-width="1.4" marker-end="url(#arrow6e7781)"/>
<text x="557.3333333333333" y="280" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle" font-style="italic">next Newton iteration, at U_np = U_n + dU</text>
<path d="M570.0,140 V128 H906" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#arrow0969da)"/>
<text x="896" y="122" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0969da" text-anchor="end">yes: done</text>
<rect x="256" y="322" width="628" height="176" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="270" y="346" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">2.  Explicit dynamic: NED, NEDParallel: no Newton loop, no linear solve</text>
<rect x="270.0" y="364" width="182.66666666666666" height="104" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
<text x="282.0" y="386" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">net force</text>
<text x="282.0" y="405" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">R = f_ext − ΣP_e</text>
<text x="282.0" y="422" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">elements: no K_e</text>
<text x="282.0" y="439" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">MPC: slave forces folded</text>
<text x="282.0" y="456" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Dirichlet rows: 0</text>
<rect x="478.66666666666663" y="364" width="182.66666666666666" height="104" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<text x="490.66666666666663" y="386" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">velocity</text>
<text x="490.66666666666663" y="405" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">V += Δt M⁻¹R, per DOF:</text>
<text x="490.66666666666663" y="422" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">M lumped, a diagonal:</text>
