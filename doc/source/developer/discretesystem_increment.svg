<text x="490.66666666666663" y="456" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Dirichlet: prescribed V</text>
<rect x="687.3333333333333" y="364" width="182.66666666666666" height="104" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
<text x="699.3333333333333" y="386" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">position</text>
<text x="699.3333333333333" y="405" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">dU = Δt V,  U += dU</text>
<text x="699.3333333333333" y="422" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">slaves follow masters</text>
