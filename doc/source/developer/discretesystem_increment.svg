<text x="24" y="572" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">U, dU, P and, for a dynamic solver, V and A go to the node fields; the next step starts from them, whichever solver solves it</text>
