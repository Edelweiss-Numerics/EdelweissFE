<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 699" width="1080" height="699" role="img" aria-label="What the solver rebuilds for each Change. NIST runs the topology update at the start of every increment: model modifiers may change the mesh, except on a retry, and model.updateConnectivity() reports the rest; the other solvers are listed on the page of the solver base class. Row 1, Change.NONE with an existing discrete system: the DofNumbering and the DofLocations are the same objects, and no hook is called. Row 2, Change.LOCATIONS, case (a): withNewLocations() keeps the DofNumbering and creates new DofLocations; onNewNumbering() is not called, so U, dU and P keep their values and the MPC condensation and the DOF layout of the linear solver are kept; onNewLocations() wraps the vectors with the new locations, creates a new SystemMatrixAssembly, and the linear solver drops its factorization. Row 3, Change.NUMBERING or MESH, cases (b) and (c), or no discrete system yet: forgetDiscreteSystem() and buildDiscreteSystem() create a new DofNumbering and new DofLocations; onNewNumbering() reads U, dU, P from the model, builds the MPC condensation and the DOF layout of the linear solver, then onNewLocations() follows. Dark blue: new per numbering; light blue: new per locations; grey and dashed: kept, or not called.">
<title>What the solver rebuilds for each Change. NIST runs the topology update at the start of every increment: model modifiers may change the mesh, except on a retry, and model.updateConnectivity() reports the rest; the other solvers are listed on the page of the solver base class. Row 1, Change.NONE with an existing discrete system: the DofNumbering and the DofLocations are the same objects, and no hook is called. Row 2, Change.LOCATIONS, case (a): withNewLocations() keeps the DofNumbering and creates new DofLocations; onNewNumbering() is not called, so U, dU and P keep their values and the MPC condensation and the DOF layout of the linear solver are kept; onNewLocations() wraps the vectors with the new locations, creates a new SystemMatrixAssembly, and the linear solver drops its factorization. Row 3, Change.NUMBERING or MESH, cases (b) and (c), or no discrete system yet: forgetDiscreteSystem() and buildDiscreteSystem() create a new DofNumbering and new DofLocations; onNewNumbering() reads U, dU, P from the model, builds the MPC condensation and the DOF layout of the linear solver, then onNewLocations() follows. Dark blue: new per numbering; light blue: new per locations; grey and dashed: kept, or not called.</title>
<defs><marker id="arrow6e7781" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/></marker></defs>
