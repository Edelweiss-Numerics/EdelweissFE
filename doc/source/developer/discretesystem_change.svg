<text x="30" y="57" xml:space="preserve" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">model modifiers may change the mesh (not on a retry); model.updateConnectivity() reports the rest; other solvers: see the solver base class</text>
