context:
  # Set by .github/workflows/conda.yml: the release tag's version (v26.11 -> 26.11), otherwise a development
  # snapshot <next release>.dev<commit time>, which conda orders before that release.
  version: ${{ env.get("EDELWEISSFE_CONDA_VERSION", default="0.0.dev0") }}
package:
  name: edelweissfe
  version: ${{ version }}
source:
  path: ../..
  use_gitignore: true
build:
  number: 0
  script:
    env:
      # Portable binaries: setup.py defaults to -march=native on Linux and macOS.
      EDELWEISSFE_ARCH_FLAGS: ""
    content:
      # --no-build-isolation: pip's isolated build would fetch setuptools, Cython and numpy from PyPI instead of
      # using the host environment's. MARMOT_INSTALL_DIR is setup.py's default (the environment), stated explicitly.
      - if: win
        then:
          - set MARMOT_INSTALL_DIR=%LIBRARY_PREFIX%
          - "%PYTHON% -m pip install . -vv --no-deps --no-build-isolation"
        else:
          - export MARMOT_INSTALL_DIR=$PREFIX
          - $PYTHON -m pip install . -vv --no-deps --no-build-isolation
  python:
    # Generated by rattler-build, not pip: pip's Windows .exe launchers embed the build environment's interpreter
    # path, which conda cannot relocate in a binary file (the launcher then exits 1 without any output).
    entry_points:
      - edelweissfe = edelweissfe._cli._edelweissfe:main
      - run_tests_edelweissfe = edelweissfe._cli._run_tests_edelweissfe:main
requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
  host:
    # Free-threaded only: the variant config (variants.yaml) selects the cp314t interpreter.
    - python
    - pip
    - setuptools
    - cython
    - numpy
    # run_exports pins marmot to exactly this build. A release builds against the Marmot release of the same version
    # (tagged first); a development snapshot against the Marmot built just before it in the same CI job.
    - ${{ "marmot" if "dev" in version else "marmot " ~ version ~ ".*" }}
    - eigen
    - amgcl
    - libboost-devel
    - suitesparse
    # OpenMP: libiomp5 (KLU and PARDISO link it by name) on Linux and macOS; MSVC uses its own vcomp.
    - if: unix
      then: llvm-openmp
    # PARDISO (Intel MKL): Linux and Windows only, MKL does not exist for macOS.
    - if: linux or win
      then: mkl-devel
  run:
    - python
    - python-freethreading
    - scipy
    - sympy
    - matplotlib-base
    - prettytable
    - gstools
    # vtk-base, not vtk: see EdelweissFE's environment.yml (vtk-io-ffmpeg's dependencies hang on Windows).
    - vtk-base
    - pyvista
    - if: unix
      then: llvm-openmp
  ignore_run_exports:
    from_package:
      # Only Boost's headers are used (by AMGCL).
      - libboost-devel
tests:
  - python:
      imports:
        - edelweissfe
      pip_check: false
  # setup.py tolerates failing extensions (optional_build_ext), so a broken one would only surface as a missing
  # module or a skipped test case: import every extension expected on this platform, then run one test case with
  # and one without Marmot.
  - files:
      source:
        - testfiles/edelweiss-only/CantileverBeamQuad4/test.inp
        - testfiles/edelweiss-only/CantileverBeamQuad4/U.ref
        - testfiles/marmot/CPS4/test.inp
        - testfiles/marmot/CPS4/U.ref
      recipe:
        - tests/check_package.py
    script:
      interpreter: python
      env:
        PYTHON_GIL: "0"
      content: |
        import runpy
        runpy.run_path("tests/check_package.py", run_name="__main__")
about:
  homepage: https://github.com/Edelweiss-Numerics/EdelweissFE
  license: LGPL-2.1-or-later
  license_file: LICENSE.md
  summary: A light-weight, platform-independent, parallel finite element framework, with Marmot elements and materials
